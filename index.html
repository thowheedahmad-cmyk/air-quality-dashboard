<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Air Quality Live Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: 'Poppins', sans-serif;
    margin:0; padding:20px;
    background:#f4f8fb;
    color:#333;
}
h1 {text-align:center; margin-bottom:20px;}
.container {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap:20px;
    margin-bottom:40px;
}
.card {
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 8px rgba(0,0,0,0.15);
    text-align:center;
}
.value {
    font-size:40px;
    font-weight:bold;
    color:#2d4b8e;
}
canvas {
    width:100% !important;
    height:250px !important;
}
</style>
</head>
<body>

<h1>Live Air Quality Dashboard</h1>

<div class="container">
    <div class="card">
        <h2>PM 2.5</h2>
        <div id="pm25" class="value">Loading...</div>
    </div>
    <div class="card">
        <h2>PM 10</h2>
        <div id="pm10" class="value">Loading...</div>
    </div>
    <div class="card">
        <h2>Temperature (°C)</h2>
        <div id="btemperature" class="value">Loading...</div>
    </div>
</div>

<h1>Live Charts</h1>
<div class="container">
    <div class="card">
        <h2>PM 2.5 Trend</h2>
        <canvas id="chartPM25"></canvas>
    </div>
    <div class="card">
        <h2>PM 10 Trend</h2>
        <canvas id="chartPM10"></canvas>
    </div>
    <div class="card">
        <h2>Temperature Trend</h2>
        <canvas id="chartTemp"></canvas>
    </div>
</div>

<script>
const channelID = "3194356";
const apiKey = "4FGOQPU4R8KDKWFD";
const resultsCount = 40; // number of points to fetch

// Create Chart.js charts
function createChart(ctx, label, color) {
    return new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: label, data: [], borderColor: color, backgroundColor: color + "33", borderWidth: 2, tension:0.3, fill:true, pointRadius:0 }] },
        options: {
            responsive:true,
            scales: { x:{ ticks:{color:'#333'} }, y:{ ticks:{color:'#333'} } },
            plugins:{ legend:{ labels:{color:'#333'} } }
        }
    });
}

let chartPM25 = createChart(document.getElementById("chartPM25"), "PM 2.5", "#2d4b8e");
let chartPM10 = createChart(document.getElementById("chartPM10"), "PM 10", "#ff9900");
let chartTemp = createChart(document.getElementById("chartTemp"), "Temperature", "#ff4d4d");

// Fetch ThingSpeak data and update dashboard
async function updateDashboard() {
    try {
        const response = await fetch(`https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${apiKey}&results=${resultsCount}`);
        const data = await response.json();
        const feeds = data.feeds;
        if (!feeds || feeds.length === 0) return;

        const latest = feeds[feeds.length - 1];

        // Use null if field is empty
        const pm25 = latest.field1 ? parseFloat(latest.field1) : null;
        const pm10 = latest.field2 ? parseFloat(latest.field2) : null;
        const btemperature = latest.field3 ? parseFloat(latest.field3) : null;

        document.getElementById("pm25").innerText = pm25 !== null ? pm25.toFixed(1) : "No data";
        document.getElementById("pm10").innerText = pm10 !== null ? pm10.toFixed(1) : "No data";
        document.getElementById("btemperature").innerText = btemperature !== null ? btemperature.toFixed(1) : "No data";

        // Prepare chart data
        const labels = feeds.map(f => new Date(f.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
        const pm25Data = feeds.map(f => f.field1 ? parseFloat(f.field1) : null);
        const pm10Data = feeds.map(f => f.field2 ? parseFloat(f.field2) : null);
        const tempData = feeds.map(f => f.field3 ? parseFloat(f.field3) : null);

        // Update charts
        chartPM25.data.labels = labels;
        chartPM25.data.datasets[0].data = pm25Data;
        chartPM25.update();

        chartPM10.data.labels = labels;
        chartPM10.data.datasets[0].data = pm10Data;
        chartPM10.update();

        chartTemp.data.labels = labels;
        chartTemp.data.datasets[0].data = tempData;
        chartTemp.update();

    } catch(err) {
        console.error("Error fetching ThingSpeak data:", err);
    }
}

// Initial fetch and auto-refresh every 20 seconds
updateDashboard();
setInterval(updateDashboard, 20000);
</script>

</body>
</html>
