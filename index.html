<!DOCTYPE html>
<html>
<head>
    <title>Air Quality Live Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2d4b8e;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            text-align: center;
        }
        .value {
            font-size: 40px;
            font-weight: bold;
            color: #333;
        }
        iframe {
            width: 100%;
            height: 260px;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<h1>Live Air Quality Dashboard</h1>

<div class="container">
    <!-- PM 2.5 Live Value -->
    <div class="card">
        <h2>PM 2.5</h2>
        <div id="pm25" class="value">Loading...</div>
    </div>

    <!-- PM 10 Live Value -->
    <div class="card">
        <h2>PM 10</h2>
        <div id="pm10" class="value">Loading...</div>
    </div>

    <!-- Temperature Live Value -->
    <div class="card">
        <h2>Temperature (°C)</h2>
        <div id="temp" class="value">Loading...</div>
    </div>
</div>

<br><br>

<h1>Live Charts</h1>

<div class="container">
    <!-- PM2.5 Chart -->
    <div class="card">
        <h2>PM 2.5 Trend</h2>
        <iframe src="https://thingspeak.com/channels/3154613/charts/1?apikey=K2KIR919YCLGJPT0&dynamic=true&results=40&update=20"></iframe>
    </div>

    <!-- PM10 Chart -->
    <div class="card">
        <h2>PM 10 Trend</h2>
        <iframe src="https://thingspeak.com/channels/3154613/charts/2?apikey=K2KIR919YCLGJPT0&dynamic=true&results=40&update=20"></iframe>
    </div>

    <!-- Temperature Chart -->
    <div class="card">
        <h2>Temperature Trend</h2>
        <iframe src="https://thingspeak.com/channels/3154613/charts/3?apikey=K2KIR919YCLGJPT0&dynamic=true&results=40&update=20"></iframe>
    </div>
</div>

<script>
    const channelID = "3194356";
    const apiKey = "4FGOQPU4R8KDKWFD";

    function updateValues() {
        fetch(`https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${apiKey}&results=1`)
        .then(response => response.json())
        .then(data => {
            let feed = data.feeds[0];

            document.getElementById("pm25").innerText = feed.field1 || "N/A";
            document.getElementById("pm10").innerText = feed.field2 || "N/A";
            document.getElementById("temp").innerText = feed.field3 || "N/A";
        });
    }

    updateValues();
    setInterval(updateValues, 20000); // refresh every 20 seconds
</script>

</body>
</html>
